# CI for infra/**: bicep build + bicep what-if against dev on PRs.
# See docs/03-Implementation-Guide.md Phase 0.8 for the full spec.
#
# Auth: OIDC federated identity via azure/login — no client secret is stored.
# The app registration must have a federated credential for this repo's
# pull_request subject claim. See docs/decisions/ or run the setup script
# described in the PR that introduced this workflow.
name: ci-infra
on:
  pull_request:
    paths: ['infra/**', '.github/workflows/ci-infra.yml']
  workflow_dispatch: {}

# Cancel superseded runs on the same PR so what-if comments don't race.
concurrency:
  group: ci-infra-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write   # OIDC federation to Azure — no secrets
  contents: read
  pull-requests: write

env:
  AZURE_RESOURCE_GROUP: rg-contoso-dev-eus2
  AZURE_CORE_NO_COLOR: '1'
  AZURE_CORE_ONLY_SHOW_ERRORS: '1'

jobs:
  what-if:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: bicep build (compile check)
        run: az bicep build --file infra/main.bicep

      - name: az deployment group what-if
        id: whatif
        run: |
          set +e
          az deployment group what-if \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters infra/env/dev.bicepparam \
            --result-format FullResourcePayloads \
            > whatif_output.txt 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

          # GitHub PR comments cap out at 65536 characters; trim with a note.
          if [ "$(wc -c < whatif_output.txt)" -gt 60000 ]; then
            tail -c 60000 whatif_output.txt > whatif_trimmed.txt
            { echo "> ⚠️ Output truncated — showing the last 60,000 characters. Full log is in the workflow run."; echo; cat whatif_trimmed.txt; } > whatif_output.txt
          fi
          exit 0

      - name: Post what-if diff as PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('whatif_output.txt', 'utf8');
            const exitCode = '${{ steps.whatif.outputs.exit_code }}';
            const status = exitCode === '0' ? '✅ what-if succeeded' : '❌ what-if failed';
            const marker = '<!-- az-deployment-what-if:dev -->';
            const comment = [
              marker,
              `### ${status} — \`infra/main.bicep\` → \`${process.env.AZURE_RESOURCE_GROUP}\``,
              '<details><summary>Show diff</summary>',
              '',
              '```diff',
              body,
              '```',
              '</details>',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: comment,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment,
              });
            }

      - name: Fail job if what-if errored
        if: steps.whatif.outputs.exit_code != '0'
        run: exit 1
